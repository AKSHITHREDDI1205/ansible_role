---
# tasks file for test
- name: install db
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: yes
- name: copy file with owner and permission
  ansible.builtin.copy:
    src: files/index.html
    dest: /var/www/html
    owner: root
    group: root
    mode: '0644'
